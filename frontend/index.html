<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Актион Ассист — техническая поддержка</title>
<style>
:root{--red:#E30611;--bg:#fff;--gray:#f5f5f7;--text:#1d1d1f;--muted:#86868b;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #eee;background:#fff}
header b{font-size:17px}
header .tag{font-size:11px;color:var(--muted);border:1px solid #e0e0e0;border-radius:6px;padding:1px 6px}
header nav{margin-left:auto;display:flex;gap:8px}
header nav button{border:none;background:var(--gray);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px;max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:var(--r);font-size:15px;line-height:1.45;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--gray)}
.msg.bot{align-self:flex-start;background:#fff;border:1px solid #ececec;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;gap:10px}
.abody{min-width:0}
.badge{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.badge b{color:var(--red)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opts button{border:1px solid #e3e3e3;background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer;min-height:44px}
.opts button:hover{border-color:var(--red);color:var(--red)}
.opts button.primary{background:var(--red);border-color:var(--red);color:#fff}
.steps{list-style:none;margin:8px 0 4px;counter-reset:s}
.steps li{counter-increment:s;padding:10px 12px;border:1px solid #ececec;border-radius:12px;margin-bottom:6px;font-size:14px}
.steps li::before{content:counter(s);display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--gray);color:var(--red);font-weight:600;text-align:center;line-height:22px;margin-right:8px;font-size:12px}
.stars{font-size:26px;cursor:pointer;letter-spacing:4px;color:#d0d0d0;margin-top:6px}
.stars span.on{color:var(--red)}
#composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #eee;max-width:760px;width:100%;margin:0 auto}
#composer input{flex:1;border:1px solid #e3e3e3;border-radius:14px;padding:12px 14px;font-size:15px;outline:none}
#composer input:focus{border-color:var(--red)}
#composer button{width:46px;height:46px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:18px;cursor:pointer}
/* ===== МАСКОТ АКТИ: векторные красные искры ===== */
.akti{width:36px;height:36px;flex:none}
.akti svg{width:100%;height:100%;display:block;overflow:visible}
.akti line,.akti .a-ring{stroke:var(--red);stroke-width:3;stroke-linecap:round;fill:none}
.akti .a-star{fill:var(--red);stroke:none}
.akti .a-rays,.akti .a-burst,.akti .a-ring,.akti .a-star{transform-box:fill-box;transform-origin:center;transition:opacity .3s}
.akti .a-ring{stroke-dasharray:8 12;opacity:0}
.akti .a-burst{opacity:0}
.akti .a-star{opacity:0}
.akti[data-state="idle"] svg{animation:a-spin 14s linear infinite}
.akti[data-state="idle"] .a-rays{animation:a-pulse 3s ease-in-out infinite}
.akti[data-state="thinking"] .a-rays{opacity:.18}
.akti[data-state="thinking"] .a-ring{opacity:1;animation:a-spin 1.1s linear infinite}
.akti[data-state="question"] svg{animation:a-spin 10s linear infinite}
.akti[data-state="question"] .a-star{opacity:1;animation:a-twinkle 1.5s ease-in-out infinite}
.akti[data-state="solution"] .a-rays{animation:a-flash 1s ease-out infinite}
.akti[data-state="success"] .a-rays{animation:a-out .7s ease-out forwards}
.akti[data-state="success"] .a-burst{animation:a-out2 .9s ease-out forwards}
.akti[data-state="escalation"] .a-rays{opacity:.4;animation:a-spin 18s linear infinite reverse}
@keyframes a-spin{to{transform:rotate(360deg)}}
@keyframes a-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes a-twinkle{0%,100%{transform:scale(.7);opacity:.55}50%{transform:scale(1.15);opacity:1}}
@keyframes a-flash{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1.04)}}
@keyframes a-out{0%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes a-out2{0%{transform:scale(.5);opacity:0}30%{opacity:1}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.akti svg,.akti .a-rays,.akti .a-ring,.akti .a-star,.akti .a-burst{animation:none !important}}
/* ===== панели ===== */
.panel{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:10}
.panel.open{display:block}
.panel .box{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:#fff;padding:16px;overflow-y:auto}
.panel input{width:100%;border:1px solid #e3e3e3;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 6px;border-bottom:1px solid #eee;text-align:left}
</style>
</head>
<body>
<header>
  <div class="akti" id="logo" data-state="idle"></div>
  <b>Актион Ассист</b><span class="tag">AI</span>
  <nav>
    <button onclick="openPanel('history')">История</button>
    <button onclick="openPanel('kb')">База знаний</button>
    <button onclick="openPanel('support')">Специалисту</button>
  </nav>
</header>
<div id="chat"></div>
<form id="composer">
  <input id="input" placeholder="Например: не могу войти в Актион 360" autocomplete="off">
  <button type="submit" aria-label="Отправить">↑</button>
</form>
<div class="panel" id="panel"><div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <b id="panelTitle"></b>
    <button onclick="closePanel()" style="border:none;background:none;font-size:20px;cursor:pointer">×</button>
  </div>
  <div id="panelBody"></div>
</div></div>

<script>
const API='/api';
let ticketId=null,pending=null;
const chat=document.getElementById('chat');
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* ===== векторный маскот ===== */
function aktiSVG(){
  const rays=[0,45,90,135,180,225,270,315].map(a=>`<line x1="32" y1="9" x2="32" y2="17" transform="rotate(${a} 32 32)"/>`).join('');
  const burst=[22.5,67.5,112.5,157.5,202.5,247.5,292.5,337.5].map(a=>`<line x1="32" y1="3" x2="32" y2="8" transform="rotate(${a} 32 32)"/>`).join('');
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g class="a-rays">${rays}</g>
    <circle class="a-ring" cx="32" cy="32" r="15"/>
    <path class="a-star" d="M41 15 Q42.6 21.4 49 23 Q42.6 24.6 41 31 Q39.4 24.6 33 23 Q39.4 21.4 41 15 Z"/>
    <g class="a-burst">${burst}</g>
  </svg>`;
}
function akti(state){const d=document.createElement('div');d.className='akti';d.dataset.state=state||'idle';d.innerHTML=aktiSVG();return d;}
function setAkti(bubble,state){const a=bubble&&bubble.querySelector('.akti');if(a)a.dataset.state=state;}
const logo=document.getElementById('logo');logo.innerHTML=aktiSVG();
const setHeader=s=>{logo.dataset.state=s;};

function addUser(t){const m=document.createElement('div');m.className='msg user';m.textContent=t;chat.appendChild(m);chat.scrollTop=chat.scrollHeight;}
function addBot(html,state){const m=document.createElement('div');m.className='msg bot';m.appendChild(akti(state));const c=document.createElement('div');c.className='abody';c.innerHTML=html;m.appendChild(c);chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return c;}
function buttons(container,list,cb,primary){const w=document.createElement('div');w.className='opts';list.forEach((o,i)=>{const b=document.createElement('button');if(i===primary)b.className='primary';b.textContent=o;b.onclick=()=>{w.remove();cb(o);};w.appendChild(b);});container.appendChild(w);}

async function api(path,opts={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opts});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
const badge=r=>r.category?`<span class="badge">Категория: <b>${esc(r.category)}</b>${r.confidence!=null?` · уверенность ${Math.round(r.confidence*100)}%`:''}</span>`:'';
const stateFor=r=>r.type==='solution'?'solution':(r.type==='escalation'?'escalation':((r.type==='question'||r.type==='clarification')?'question':'idle'));

async function send(text){
  addUser(text);
  pending=addBot('Разбираюсь в проблеме…','thinking');
  setHeader('thinking');
  let r;
  try{r=await api('/chat',{method:'POST',body:JSON.stringify({ticket_id:ticketId,message:text})});}
  catch(e){pending.innerHTML='Не удалось получить ответ прямо сейчас. Попробуйте ещё раз или передайте обращение специалисту.';setAkti(pending.parentElement,'escalation');setHeader('idle');pending=null;return;}
  if(r.ticket_id)ticketId=r.ticket_id;
  render(r);
}

function render(r){
  const c=pending||addBot('',stateFor(r));pending=null;
  setAkti(c.parentElement,stateFor(r));
  setHeader(stateFor(r));
  c.innerHTML=badge(r)+esc(r.message||'');
  if((r.type==='question'||r.type==='clarification')&&r.options&&r.options.length){buttons(c,r.options,o=>send(o));return;}
  if(r.type==='solution'&&r.steps&&r.steps.length){
    const ol=document.createElement('ol');ol.className='steps';
    r.steps.forEach(s=>{const li=document.createElement('li');li.textContent=s;ol.appendChild(li);});
    c.appendChild(ol);
    buttons(c,['Выполнил(а) шаги'],()=>{
      const q=addBot(esc(r.success_question||'Проблема решена?'),'solution');
      buttons(q,['Да, проблема решена','Нет, проблема осталась'],a=>a.startsWith('Да')?resolve():notHelped());
    },0);
    return;
  }
  if(r.type==='escalation'){escalateButtons(c);}
}

function escalateButtons(c){
  buttons(c,['Передать специалисту'],async()=>{
    try{
      await api(`/tickets/${ticketId}/escalate`,{method:'POST'});
      addBot(`Я передал обращение специалисту. Номер: #${ticketId}. Карточка с историей диагностики уже в кабинете поддержки.`,'escalation');
      setHeader('escalation');setTimeout(()=>setHeader('idle'),2000);
    }catch(e){addBot('Не удалось создать обращение. Попробуйте ещё раз.','escalation');}
  },0);
}

function notHelped(){
  const c=addBot('Похоже, стандартные способы не помогли.','escalation');
  escalateButtons(c);
}

async function resolve(){
  try{await api(`/tickets/${ticketId}/resolve`,{method:'POST'});}catch(e){}
  const c=addBot(`✓ Проблема решена. Обращение #${ticketId} закрыто.\nПомог ли вам Акти?`,'success');
  setTimeout(()=>setAkti(c.parentElement,'idle'),1600);
  stars(c);
}

function stars(c){
  const w=document.createElement('div');w.className='stars';
  for(let i=1;i<=5;i++){const s=document.createElement('span');s.textContent='★';
    s.onclick=async()=>{[...w.children].forEach((el,idx)=>el.className=idx<i?'on':'');
      try{await api('/feedback',{method:'POST',body:JSON.stringify({ticket_id:ticketId,rating:i})});}catch(e){}
      addBot('Спасибо за оценку! Чем ещё помочь?','idle');};
    w.appendChild(s);}
  c.appendChild(w);
}

document.getElementById('composer').onsubmit=e=>{e.preventDefault();const v=document.getElementById('input').value.trim();if(!v)return;document.getElementById('input').value='';send(v);};

async function openPanel(kind){
  const p=document.getElementById('panel');p.classList.add('open');
  const body=document.getElementById('panelBody');body.innerHTML='Загрузка…';
  try{
    if(kind==='history'){
      document.getElementById('panelTitle').textContent='История обращений';
      const list=await api('/tickets');
      body.innerHTML=Array.isArray(list)&&list.length?table(list,['id','category','status']):'<p>Пока обращений нет.</p>';
    }else if(kind==='support'){
      document.getElementById('panelTitle').textContent='Кабинет специалиста';
      const list=await api('/support/tickets');
      body.innerHTML=Array.isArray(list)&&list.length?table(list,['id','category','status','confidence']):'<p>Очередь пуста.</p>';
    }else{
      document.getElementById('panelTitle').textContent='Поиск по базе знаний';
      body.innerHTML='<input id="kbq" placeholder="Например: не приходит письмо"><div id="kbr"></div>';
      document.getElementById('kbq').oninput=async e=>{
        const q=e.target.value.trim();if(q.length<3)return;
        try{const res=await api('/knowledge/search?q='+encodeURIComponent(q));
          const list=Array.isArray(res)?res:(res.results||[]);
          document.getElementById('kbr').innerHTML=list.length?table(list,['title','category']):'<p>Ничего не найдено.</p>';
        }catch(err){document.getElementById('kbr').innerHTML='<p>Поиск временно недоступен.</p>';}
      };
    }
  }catch(e){body.innerHTML='Не удалось загрузить данные.';}
}
function table(rows,cols){return '<table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('')+'</table>';}
function closePanel(){document.getElementById('panel').classList.remove('open');}

/* приветствие */
(async()=>{
  const c=addBot('Привет! Я Акти. Опишите проблему своими словами — я помогу разобраться.','idle');
  buttons(c,['Не могу войти в Актион 360','Не приходит письмо','Не открывается страница','Нет звука на вебинаре'],o=>send(o));
})();
</script>
</body>
</html>
