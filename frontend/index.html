<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Актион Ассист — техническая поддержка</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%23E30611" d="M96 50 60.6 52.8 70.8 62 57.4 56.7 72.9 82.8 53.8 60.3 51.9 71.9 48.6 59.9 34.9 91.3 43.7 59 30.1 66.7 41.2 54.7 13.3 59.8 39 50 28.7 44.3 41.1 45.5 14.8 20.4 43.7 41 41.8 27.4 48.6 40.1 53.5 10.2 53.8 39.7 64.9 28.7 57.9 43.8Z"/></svg>'>
<style>
:root{--red:#E30611;--red-d:#B00500;--pink:#FF8A92;--bg:#fff;--gray:#f5f5f7;--text:#1d1d1f;--muted:#86868b;--r:24px;--sh:0 10px 36px rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh;-webkit-font-smoothing:antialiased}
::selection{background:rgba(227,6,17,.14)}

/* ===== ЖИДКОЕ СТЕКЛО: нейтральные стеклянные облака, видимые всегда ===== */
.glass-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glass-bg i{position:absolute;display:block;backdrop-filter:blur(20px) saturate(1.15);-webkit-backdrop-filter:blur(20px) saturate(1.15);box-shadow:inset 0 1px 1px rgba(255,255,255,.8),inset 0 -2px 6px rgba(255,255,255,.4),0 16px 50px rgba(20,20,25,.05);opacity:.75;border:1px solid rgba(255,255,255,.55)}
.glass-bg .g1{width:58vw;height:42vw;left:-14vw;top:-10vw;background:linear-gradient(145deg,rgba(236,236,240,.6),rgba(248,248,250,.25));animation:g-drift1 46s ease-in-out infinite,g-morph 23s ease-in-out infinite}
.glass-bg .g2{width:50vw;height:38vw;right:-12vw;top:28vh;background:linear-gradient(145deg,rgba(243,240,238,.55),rgba(250,249,247,.22));animation:g-drift2 52s ease-in-out infinite,g-morph 29s ease-in-out infinite reverse}
.glass-bg .g3{width:36vw;height:30vw;left:24vw;bottom:-12vh;background:linear-gradient(145deg,rgba(238,241,244,.5),rgba(248,250,251,.2));animation:g-drift3 58s ease-in-out infinite,g-morph 31s ease-in-out infinite}
@keyframes g-morph{0%,100%{border-radius:58% 42% 55% 45%/52% 48% 52% 48%}33%{border-radius:45% 55% 48% 52%/58% 42% 55% 45%}66%{border-radius:52% 48% 42% 58%/45% 55% 45% 55%}}
@keyframes g-drift1{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(6vw,4vh) rotate(9deg)}}
@keyframes g-drift2{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-5vw,-6vh) rotate(-7deg)}}
@keyframes g-drift3{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(4vw,-5vh) rotate(6deg)}}
@media (max-width:768px){.glass-bg i{backdrop-filter:none;-webkit-backdrop-filter:none;opacity:.55}}

/* ===== КРУПНЫЙ ИНТЕРФЕЙС ===== */
header{display:flex;align-items:center;gap:12px;padding:15px 22px;border-bottom:1px solid #f0f0f2;background:rgba(255,255,255,.82);backdrop-filter:saturate(1.4) blur(10px);position:sticky;top:0;z-index:5}
header b{font-size:19px;letter-spacing:-.01em}
header .tag{font-size:12px;color:var(--muted);border:1px solid #e6e6e9;border-radius:7px;padding:2px 7px}
header nav{margin-left:auto;display:flex;gap:9px}
header nav button{border:none;background:var(--gray);border-radius:13px;padding:11px 16px;font-size:14px;cursor:pointer;transition:.2s}
header nav button:hover{background:#ececef;transform:translateY(-1px)}
#chat{flex:1;overflow-y:auto;padding:28px 22px;max-width:980px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
#chat::-webkit-scrollbar{width:9px}
#chat::-webkit-scrollbar-thumb{background:#e3e3e6;border-radius:8px}
.hero{text-align:center;padding:34px 0 8px;transition:opacity .45s,transform .45s;animation:pop .6s cubic-bezier(.2,.9,.3,1.15)}
.hero.hide{opacity:0;transform:translateY(-10px);height:0;padding:0;overflow:hidden;pointer-events:none}
.hero h1{font-size:clamp(32px,6.5vw,52px);letter-spacing:-.03em;font-weight:700;margin-top:14px}
.hero h1 b{color:var(--red)}
.hero p{color:var(--muted);font-size:17px;margin-top:8px}
.msg{max-width:90%;padding:16px 19px;border-radius:var(--r);font-size:16.5px;line-height:1.55;white-space:pre-wrap;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.msg.user{align-self:flex-end;background:rgba(245,245,247,.92)}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.88);border:1px solid #ededf0;box-shadow:var(--sh);display:flex;gap:13px;backdrop-filter:blur(6px)}
.abody{min-width:0}
.badge{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
.badge b{color:var(--red)}
.opts{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}
.opts button{border:1px solid #e6e6e9;background:#fff;border-radius:15px;padding:13px 18px;font-size:15px;cursor:pointer;min-height:48px;transition:.18s}
.opts button:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px);box-shadow:0 6px 16px rgba(227,6,17,.12)}
.opts button:active{transform:scale(.97)}
.opts button.primary{background:var(--red);border-color:var(--red);color:#fff}
.opts button.primary:hover{background:var(--red-d)}
.steps{list-style:none;margin:11px 0 5px;counter-reset:s}
.steps li{counter-increment:s;padding:13px 15px;border:1px solid #ededf0;border-radius:16px;margin-bottom:8px;font-size:15.5px;transition:.18s;background:#fff}
.steps li:hover{border-color:rgba(227,6,17,.35)}
.steps li::before{content:counter(s);display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--gray);color:var(--red);font-weight:700;text-align:center;line-height:24px;margin-right:10px;font-size:13px}
.stars{font-size:30px;cursor:pointer;letter-spacing:6px;color:#d6d6da;margin-top:8px}
.stars span{transition:.15s}
.stars span:hover{transform:scale(1.2)}
.stars span.on{color:var(--red)}
#composer{display:flex;gap:10px;padding:15px 22px;border-top:1px solid #f0f0f2;max-width:980px;width:100%;margin:0 auto;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);position:relative;z-index:2}
#composer input{flex:1;border:1px solid #e6e6e9;border-radius:18px;padding:15px 18px;font-size:16px;outline:none;transition:.2s}
#composer input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(227,6,17,.08)}
#composer button{width:52px;height:52px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:19px;cursor:pointer;transition:.18s;box-shadow:0 6px 18px rgba(227,6,17,.28)}
#composer button:hover{background:var(--red-d);transform:translateY(-1px)}
#composer button:active{transform:scale(.94)}

/* =========================================================
   АКТИ v8 — мимика ТОЛЬКО белыми глазами
   ========================================================= */
.akti{flex:none;--ex:0px;--ey:0px}
.akti svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 80%}
.akti .a-glow{fill:var(--red);opacity:.14;filter:blur(9px);transform-box:fill-box;transform-origin:center;transition:opacity .5s ease;animation:k-glowmorph 4.2s ease-in-out infinite}
.akti .a-core{fill:var(--red);transform-box:fill-box;transform-origin:center;transition:transform .55s cubic-bezier(.34,1.4,.44,1),filter .5s ease,opacity .5s ease;filter:drop-shadow(0 0 5px rgba(227,6,17,.45)) drop-shadow(0 0 15px rgba(227,6,17,.2))}
.akti .a-halo{fill:none;stroke:var(--red);stroke-width:2.5;stroke-dasharray:3 11;stroke-linecap:round;opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .5s}
.akti .a-mini{fill:var(--red);opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .4s}
.akti .a-body,.akti .a-s,.akti .a-faceg,.akti .a-face,.akti .a-eye,.akti .a-tear{transform-box:fill-box;transform-origin:center}
.akti .a-s{fill:var(--red);opacity:0}
.akti .s1{animation:k-star 4.2s ease-in-out infinite .6s}
.akti .s2{animation:k-star 5.4s ease-in-out infinite 2s}
.akti .s3{animation:k-star 4.8s ease-in-out infinite 3s}
.akti .s4{animation:k-star 6.2s ease-in-out infinite 1.2s}
.akti .a-q{fill:var(--red);font-family:-apple-system,"Segoe UI",sans-serif;font-weight:900;font-size:56px;text-anchor:middle;dominant-baseline:central;opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .3s,transform .45s cubic-bezier(.3,1.4,.4,1);filter:drop-shadow(0 0 8px rgba(227,6,17,.5))}
/* белые глаза */
.akti .a-eye{fill:#fff;transition:transform .3s ease}
.akti .a-face{transform:translate(var(--ex),var(--ey));transition:transform .45s ease}
.akti .a-faceg{transition:transform .4s cubic-bezier(.34,1.4,.44,1)}
.akti .a-blush{fill:var(--pink);filter:blur(2.6px);opacity:0;transition:opacity .6s ease,transform .6s ease;transform-box:fill-box;transform-origin:center}
.akti .a-tear{fill:var(--pink);opacity:0;filter:blur(.4px)}

/* логотип: покачивание + свечение, без лица */
.akti.logo{width:36px;height:36px}
.akti.logo svg{animation:k-sway 7s ease-in-out infinite}
.akti.logo .a-s,.akti.logo .a-mini,.akti.logo .a-halo,.akti.logo .a-face,.akti.logo .a-tear,.akti.logo .a-q{display:none}

/* hero крупнее */
.hero-akti-wrap{perspective:600px;width:180px;height:180px;margin:0 auto;position:relative}
.hero-akti{width:100%;height:100%;transition:transform .35s cubic-bezier(.25,.9,.3,1.1);transform-style:preserve-3d;will-change:transform}
.hero-akti .a-s.s1{transform:translateZ(40px)}
.hero-akti .a-s.s2{transform:translateZ(60px)}
.hero-akti .a-s.s3{transform:translateZ(30px)}
.hero-akti .a-s.s4{transform:translateZ(50px)}
.msg .akti{width:46px;height:46px}

/* hover */
.akti:hover .a-body{animation:k-squish 1.8s ease-in-out infinite}
.akti:hover .a-core{filter:hue-rotate(16deg) drop-shadow(0 0 9px rgba(227,6,17,.65)) drop-shadow(0 0 24px rgba(227,6,17,.35))}
.akti:hover .a-glow{opacity:.42;animation:k-glowmorph 1.6s ease-in-out infinite}
.akti:hover .a-faceg{transform:scale(1.1)}
.akti:hover .a-blush{opacity:.4}
.akti:hover .a-eye.el,.akti:hover .a-eye.er{animation:e-hover 2.2s ease-in-out infinite}

/* ===== СОСТОЯНИЯ ТЕЛА ===== */
.akti[data-state="idle"] svg{animation:k-sway 5.2s ease-in-out infinite}
.akti[data-state="idle"] .a-body{animation:k-float 5.5s ease-in-out infinite}
.akti[data-state="idle"] .a-eye.el,.akti[data-state="idle"] .a-eye.er{animation:e-idle 4.8s ease-in-out infinite}

.akti[data-state="thinking"]{--ey:-2px}
.akti[data-state="thinking"] svg{animation:k-sway 2.3s ease-in-out infinite}
.akti[data-state="thinking"] .a-body{animation:k-float 2.6s ease-in-out infinite}
.akti[data-state="thinking"] .a-glow{animation:k-glowmorph 1.7s ease-in-out infinite}
.akti[data-state="thinking"] .a-halo{opacity:.7;animation:k-spin 4s linear infinite reverse}
.akti[data-state="thinking"] .a-eye.el{animation:e-think-l 3.6s ease-in-out infinite}
.akti[data-state="thinking"] .a-eye.er{animation:e-think-r 3.6s ease-in-out infinite}

.akti[data-state="question"]{--ey:-1px}
.akti[data-state="question"] svg{animation:k-sway 3.4s ease-in-out infinite}
.akti[data-state="question"] .a-faceg{transform:scale(1.08)}
.akti[data-state="question"] .s2{animation:k-star 1.8s ease-in-out infinite}
.akti[data-state="question"] .a-mini{opacity:1;animation:k-twinkle 1.8s ease-in-out infinite}
.akti[data-state="question"] .a-eye.el{animation:e-cur-l 5s ease-in-out infinite}
.akti[data-state="question"] .a-eye.er{animation:e-cur-r 5s ease-in-out infinite}

.akti[data-state="solution"]{--ey:-1px}
.akti[data-state="solution"] svg{animation:k-sway 1.5s ease-in-out infinite}
.akti[data-state="solution"] .a-body{animation:k-joy 1.3s ease-in-out infinite}
.akti[data-state="solution"] .a-eye.el{animation:e-happy-l 1.6s ease-in-out infinite}
.akti[data-state="solution"] .a-eye.er{animation:e-happy-r 1.6s ease-in-out infinite}
.akti[data-state="solution"] .a-blush{opacity:.55;transform:scale(1.1)}
.akti[data-state="solution"] .a-glow{opacity:.3;animation:k-glowmorph 1.2s ease-in-out infinite}
.akti[data-state="solution"] .a-s{animation:k-star 1.6s ease-in-out infinite}

.akti[data-state="success"]{--ey:-1px}
.akti[data-state="success"] svg{animation:k-wiggle .95s cubic-bezier(.3,1.4,.4,1) 1,k-sway 1.4s ease-in-out infinite .95s}
.akti[data-state="success"] .a-body{animation:k-joy 1.3s ease-in-out infinite,k-joybig .85s cubic-bezier(.3,1.5,.4,1) 1}
.akti[data-state="success"] .a-eye.el{animation:e-happy-l 1.2s ease-in-out infinite}
.akti[data-state="success"] .a-eye.er{animation:e-happy-r 1.2s ease-in-out infinite}
.akti[data-state="success"] .a-blush{opacity:.7;transform:scale(1.2)}
.akti[data-state="success"] .a-glow{animation:k-flare 1s ease-out forwards}
.akti[data-state="success"] .a-halo{opacity:1;animation:k-halo 1s ease-out forwards}
.akti[data-state="success"] .s1{animation:k-fly1 1s ease-out forwards}
.akti[data-state="success"] .s2{animation:k-fly2 1s ease-out forwards}
.akti[data-state="success"] .s3{animation:k-fly3 1s ease-out forwards}
.akti[data-state="success"] .s4{animation:k-fly4 1s ease-out forwards}

/* грусть: глаза полуприкрыты и опущены */
.akti[data-state="escalation"],.akti[data-state="slow"]{--ey:2.5px}
.akti[data-state="escalation"] svg,.akti[data-state="slow"] svg{animation:k-sway-sad 9s ease-in-out infinite}
.akti[data-state="escalation"] .a-body,.akti[data-state="slow"] .a-body{animation:k-droop 4.5s ease-in-out infinite}
.akti[data-state="escalation"] .a-core,.akti[data-state="slow"] .a-core{filter:saturate(.55) brightness(.88) drop-shadow(0 0 4px rgba(227,6,17,.22))}
.akti[data-state="escalation"] .a-s,.akti[data-state="slow"] .a-s{animation:none;opacity:0}
.akti[data-state="escalation"] .a-eye.el,.akti[data-state="slow"] .a-eye.el{animation:e-sad-l 6s ease-in-out infinite}
.akti[data-state="escalation"] .a-eye.er,.akti[data-state="slow"] .a-eye.er{animation:e-sad-r 6s ease-in-out infinite}
.akti[data-state="escalation"] .a-glow,.akti[data-state="slow"] .a-glow{opacity:.06;animation:k-glowmorph 7s ease-in-out infinite}
.akti[data-state="escalation"] .a-tear,.akti[data-state="slow"] .a-tear{animation:k-tear 2.4s ease-in infinite}
.akti[data-state="escalation"] .a-tear.tr,.akti[data-state="slow"] .a-tear.tr{animation-delay:1.2s}
.akti[data-state="slow"] svg{animation-duration:12s}

/* смущение: косят в сторону */
.akti[data-mood="shy"]{--ex:3px;--ey:1px}
.akti[data-mood="shy"] .a-body{animation:k-shy 2.4s ease-in-out infinite}
.akti[data-mood="shy"] .a-core{filter:hue-rotate(-14deg) drop-shadow(0 0 7px rgba(255,138,146,.6))}
.akti[data-mood="shy"] .a-blush{opacity:.75;transform:scale(1.25)}
.akti[data-mood="shy"] .a-eye.el{animation:e-shy-l 2.4s ease-in-out infinite}
.akti[data-mood="shy"] .a-eye.er{animation:e-shy-r 2.4s ease-in-out infinite}
/* подмигивание */
.akti[data-mood="wink"] .a-eye.er{animation:e-wink .8s ease-in-out 1}

/* typing */
.hero-akti[data-typing="true"] .a-core{transform:scale(.45);opacity:.4}
.hero-akti[data-typing="true"] .a-glow{opacity:.08}
.hero-akti[data-typing="true"] .a-s{animation:none;opacity:0}
.hero-akti[data-typing="true"] .a-mini{opacity:0}
.hero-akti[data-typing="true"] .a-face{opacity:.25}
.hero-akti[data-typing="true"] .a-q{opacity:1;animation:k-q-pulse 1.4s ease-in-out infinite}

/* ===== кадры тела ===== */
@keyframes k-spin{to{transform:rotate(360deg)}}
@keyframes k-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes k-sway-sad{0%,100%{transform:rotate(-2.5deg) translateY(1px)}50%{transform:rotate(2.5deg) translateY(2px)}}
@keyframes k-wiggle{0%{transform:rotate(0deg)}25%{transform:rotate(-11deg)}50%{transform:rotate(9deg)}75%{transform:rotate(-5deg)}100%{transform:rotate(0deg)}}
@keyframes k-glowmorph{0%,100%{transform:scale(1,1) rotate(0deg);opacity:.13}33%{transform:scale(1.22,.82) rotate(9deg);opacity:.22}66%{transform:scale(.88,1.16) rotate(-7deg);opacity:.17}}
@keyframes k-float{0%,100%{transform:translateY(0) scale(1) rotate(0deg)}50%{transform:translateY(-3px) scale(1.03) rotate(1.5deg)}}
@keyframes k-squish{0%,100%{transform:scale(1,1) rotate(0deg)}25%{transform:scale(1.14,.86) rotate(3deg)}50%{transform:scale(.9,1.12) rotate(-3deg)}75%{transform:scale(1.08,.92) rotate(2deg)}}
@keyframes k-joy{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-6px) scale(.95,1.07) rotate(-3deg)}55%{transform:translateY(0) scale(1.08,.92)}75%{transform:translateY(-3px) scale(.98,1.03) rotate(2deg)}}
@keyframes k-joybig{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-14px) scale(.9,1.15) rotate(-8deg)}60%{transform:translateY(0) scale(1.15,.85)}80%{transform:translateY(-4px) scale(.98,1.04)}100%{transform:translateY(0) scale(1)}}
@keyframes k-droop{0%,100%{transform:translateY(2px) scale(1.06,.86)}50%{transform:translateY(4px) scale(1.1,.82)}}
@keyframes k-tear{0%{opacity:0;transform:translateY(0) scale(.5)}18%{opacity:.85}100%{opacity:0;transform:translateY(15px) scale(1.05)}}
@keyframes k-shy{0%,100%{transform:rotate(-4deg) scale(.97)}50%{transform:rotate(-7deg) scale(.95)}}
@keyframes k-twinkle{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.08);opacity:1}}
@keyframes k-star{0%,100%{opacity:0;transform:scale(.25) rotate(0deg)}15%{opacity:1;transform:scale(1.1) rotate(20deg)}35%{opacity:0;transform:scale(.35) rotate(45deg)}}
@keyframes k-halo{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes k-flare{0%{opacity:.4;transform:scale(1,1)}35%{opacity:.6;transform:scale(1.4,1.15)}100%{opacity:0;transform:scale(1.8,1.5)}}
@keyframes k-fly1{0%{opacity:0;transform:translate(0,0) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(-16px,-16px) scale(1.05) rotate(80deg)}}
@keyframes k-fly2{0%{opacity:0;transform:translate(0,0) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(16px,-14px) scale(.95) rotate(-70deg)}}
@keyframes k-fly3{0%{opacity:0;transform:translate(0,0) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(-14px,15px) scale(.85) rotate(60deg)}}
@keyframes k-fly4{0%{opacity:0;transform:translate(0,0) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(15px,14px) scale(.8) rotate(-80deg)}}
@keyframes k-q-pulse{0%,100%{transform:scale(1) rotate(-5deg)}50%{transform:scale(1.1) rotate(4deg)}}

/* ===== кадры ГЛАЗ (вся мимика) ===== */
@keyframes e-idle{0%,88%,100%{transform:scale(1)}92%{transform:scaleY(.1)}96%{transform:scale(1)}}
@keyframes e-think-l{0%,84%,100%{transform:scaleY(.78) translateY(-1px)}88%{transform:scaleY(.1)}92%{transform:scaleY(.78) translateY(-1px)}}
@keyframes e-think-r{0%,84%,100%{transform:scaleY(1.1) translateY(-1.6px)}88%{transform:scaleY(.1)}92%{transform:scaleY(1.1) translateY(-1.6px)}}
@keyframes e-cur-l{0%,90%,100%{transform:scale(1.22) rotate(7deg)}94%{transform:scaleY(.12)}97%{transform:scale(1.22) rotate(7deg)}}
@keyframes e-cur-r{0%,90%,100%{transform:scale(1.22) rotate(-7deg)}94%{transform:scaleY(.12)}97%{transform:scale(1.22) rotate(-7deg)}}
@keyframes e-happy-l{0%,100%{transform:scaleY(.36) rotate(10deg) translateY(-1px)}50%{transform:scaleY(.46) rotate(8deg) translateY(-1.5px)}}
@keyframes e-happy-r{0%,100%{transform:scaleY(.36) rotate(-10deg) translateY(-1px)}50%{transform:scaleY(.46) rotate(-8deg) translateY(-1.5px)}}
@keyframes e-sad-l{0%,90%,100%{transform:scaleY(.52) translateY(2px) rotate(-7deg)}94%{transform:scaleY(.1)}97%{transform:scaleY(.52) translateY(2px) rotate(-7deg)}}
@keyframes e-sad-r{0%,90%,100%{transform:scaleY(.52) translateY(2px) rotate(7deg)}94%{transform:scaleY(.1)}97%{transform:scaleY(.52) translateY(2px) rotate(7deg)}}
@keyframes e-shy-l{0%,100%{transform:scale(1.05) translateX(2.5px)}}
@keyframes e-shy-r{0%,100%{transform:scaleY(.68) translateX(2.5px)}}
@keyframes e-hover{0%,70%,100%{transform:scale(1.18)}76%{transform:scaleY(.12)}82%{transform:scale(1.18)}88%{transform:scaleY(.12)}94%{transform:scale(1.18)}}
@keyframes e-wink{0%,100%{transform:scale(1)}45%,60%{transform:scaleY(.08)}}

/* салют */
.salut-p{position:fixed;width:var(--size,6px);height:var(--size,6px);background:var(--c,var(--red));pointer-events:none;z-index:100;animation:salut-fly 1.15s cubic-bezier(.2,.7,.4,1) forwards;box-shadow:0 0 10px currentColor;border-radius:50% 10% 50% 10%;transform:translate(-50%,-50%);color:var(--c,var(--red))}
@keyframes salut-fly{0%{opacity:1;transform:translate(-50%,-50%) scale(.2) rotate(0)}60%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 60px)) scale(1.15) rotate(var(--rot))}}

/* панели */
.panel{position:fixed;inset:0;background:rgba(20,20,22,.35);backdrop-filter:blur(2px);display:none;z-index:10}
.panel.open{display:block}
.panel .box{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:#fff;padding:20px;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.12);border-radius:26px 0 0 26px;animation:slide .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.panel input{width:100%;border:1px solid #e6e6e9;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:15px;outline:none}
.panel input:focus{border-color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 7px;border-bottom:1px solid #f0f0f2;text-align:left}
th{color:var(--muted);font-weight:600}

@media (prefers-reduced-motion:reduce){.akti svg,.akti .a-body,.akti .a-core,.akti .a-mini,.akti .a-halo,.akti .a-glow,.akti .a-s,.akti .a-q,.akti .a-eye,.akti .a-tear,.msg,.hero,.salut-p,.glass-bg i{animation:none !important;transition:none !important}}
@media (max-width:640px){.hero-akti-wrap{width:130px;height:130px}.msg{font-size:15.5px}}
</style>
</head>
<body>
<div class="glass-bg" aria-hidden="true"><i class="g1"></i><i class="g2"></i><i class="g3"></i></div>
<header>
  <div class="akti logo" id="logo" data-state="idle"></div>
  <b>Актион Ассист</b><span class="tag">AI</span>
  <nav>
    <button onclick="openPanel('history')">История</button>
    <button onclick="openPanel('kb')">База знаний</button>
    <button onclick="openPanel('support')">Специалисту</button>
  </nav>
</header>
<div id="chat">
  <div class="hero" id="hero">
    <div class="hero-akti-wrap">
      <div class="akti hero-akti" id="heroAkti" data-state="idle"></div>
    </div>
    <h1>Привет! Я <b>Акти</b></h1>
    <p>Решаю технические проблемы с продуктами Актиона — быстро и по-человечески.</p>
  </div>
</div>
<form id="composer">
  <input id="input" placeholder="Например: не могу войти в Актион 360" autocomplete="off">
  <button type="submit" aria-label="Отправить">↑</button>
</form>
<div class="panel" id="panel"><div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <b id="panelTitle"></b>
    <button onclick="closePanel()" style="border:none;background:none;font-size:20px;cursor:pointer">×</button>
  </div>
  <div id="panelBody"></div>
</div></div>

<script>
const API='/api';
let ticketId=null,pending=null;
const chat=document.getElementById('chat');
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* ===== SVG Акти v8: только белые глаза ===== */
const SPARK="M96 50 60.6 52.8 70.8 62 57.4 56.7 72.9 82.8 53.8 60.3 51.9 71.9 48.6 59.9 34.9 91.3 43.7 59 30.1 66.7 41.2 54.7 13.3 59.8 39 50 28.7 44.3 41.1 45.5 14.8 20.4 43.7 41 41.8 27.4 48.6 40.1 53.5 10.2 53.8 39.7 64.9 28.7 57.9 43.8Z";
const STAR="M10 0 Q11.6 6.8 20 10 Q11.6 13.2 10 20 Q8.4 13.2 0 10 Q8.4 6.8 10 0Z";
const TEAR="M0 0 c2.6 4.2 2.6 7.4 0 9.6 c-2.6 -2.2 -2.6 -5.4 0 -9.6Z";
function aktiSVG(){return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<ellipse class="a-glow" cx="50" cy="50" rx="30" ry="23"/>
<circle class="a-halo" cx="50" cy="50" r="45"/>
<g class="a-body">
  <path class="a-core" d="${SPARK}"/>
  <g class="a-faceg"><g class="a-face">
    <ellipse class="a-eye el" cx="41" cy="45" rx="4.8" ry="6.4"/>
    <ellipse class="a-eye er" cx="59" cy="45" rx="4.8" ry="6.4"/>
    <circle class="a-blush" cx="32.5" cy="54.5" r="4.6"/>
    <circle class="a-blush" cx="67.5" cy="54.5" r="4.6"/>
  </g></g>
  <g transform="translate(38 56)"><path class="a-tear tl" d="${TEAR}"/></g>
  <g transform="translate(60 56)"><path class="a-tear tr" d="${TEAR}"/></g>
  <g transform="translate(74 6) scale(.3)"><path class="a-mini" d="${SPARK}"/></g>
</g>
<g transform="translate(6 12) scale(.8)"><path class="a-s s1" d="${STAR}"/></g>
<g transform="translate(78 18) scale(.6)"><path class="a-s s2" d="${STAR}"/></g>
<g transform="translate(10 74) scale(.7)"><path class="a-s s3" d="${STAR}"/></g>
<g transform="translate(76 70) scale(.5)"><path class="a-s s4" d="${STAR}"/></g>
<text class="a-q" x="50" y="52">?</text>
</svg>`;}
function akti(state){const d=document.createElement('div');d.className='akti';d.dataset.state=state||'idle';d.innerHTML=aktiSVG();return d;}
function setAkti(bubble,state){const a=bubble&&bubble.querySelector('.akti');if(a)a.dataset.state=state;}
document.querySelectorAll('.akti').forEach(el=>{el.innerHTML=aktiSVG();});
const logo=document.getElementById('logo');
const heroAkti=document.getElementById('heroAkti');
const heroWrap=document.querySelector('.hero-akti-wrap');
const setHeader=s=>{logo.dataset.state=s;};

/* параллакс + взгляд */
let rafId=null;
heroWrap.addEventListener('mousemove',e=>{
  const rect=heroWrap.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width-.5;
  const y=(e.clientY-rect.top)/rect.height-.5;
  if(rafId)cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(()=>{
    heroAkti.style.transform=`rotateY(${x*26}deg) rotateX(${-y*22}deg) translate(${x*9}px,${y*9}px)`;
    heroAkti.style.setProperty('--ex',(x*4).toFixed(1)+'px');
    heroAkti.style.setProperty('--ey',(y*3).toFixed(1)+'px');
  });
});
heroWrap.addEventListener('mouseleave',()=>{
  heroAkti.style.transform='';
  heroAkti.style.removeProperty('--ex');
  heroAkti.style.removeProperty('--ey');
});
window.addEventListener('deviceorientation',e=>{
  if(e.gamma==null)return;
  const x=Math.max(-1,Math.min(1,(e.gamma||0)/30));
  const y=Math.max(-1,Math.min(1,((e.beta||0)-45)/30));
  heroAkti.style.transform=`rotateY(${x*18}deg) rotateX(${-y*14}deg)`;
},{passive:true});

/* typing */
const inputEl=document.getElementById('input');
inputEl.addEventListener('input',()=>{heroAkti.dataset.typing=inputEl.value.trim()?'true':'false';});

/* режиссёр настроений */
setInterval(()=>{
  if(heroAkti.dataset.state!=='idle'||heroAkti.dataset.typing==='true')return;
  const roll=Math.random();
  if(roll<.22){heroAkti.dataset.mood='wink';setTimeout(()=>{if(heroAkti.dataset.mood==='wink')heroAkti.dataset.mood='';},900);}
  else if(roll<.45){heroAkti.dataset.mood='shy';setTimeout(()=>{if(heroAkti.dataset.mood==='shy')heroAkti.dataset.mood='';},2400);}
  else if(roll<.75){const dx=(Math.random()<.5?-2.5:2.5);heroAkti.style.setProperty('--ex',dx+'px');setTimeout(()=>{if(!heroAkti.matches(':hover'))heroAkti.style.removeProperty('--ex');},1600);}
},6500);

/* салют */
function burstSalut(origin,count=18){
  const rect=origin.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;
  const colors=['#E30611','#FF2A38','#B00500','#FF5A63','#FF8A92'];
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='salut-p';
    const angle=(Math.PI*2*i)/count+(Math.random()-.5)*.5;
    const dist=70+Math.random()*110;
    p.style.left=cx+'px';
    p.style.top=cy+'px';
    p.style.setProperty('--dx',(Math.cos(angle)*dist)+'px');
    p.style.setProperty('--dy',(Math.sin(angle)*dist-20)+'px');
    p.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    p.style.setProperty('--size',(4+Math.random()*7)+'px');
    p.style.setProperty('--c',colors[i%colors.length]);
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1350);
  }
}

function addUser(t){const m=document.createElement('div');m.className='msg user';m.textContent=t;chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return m;}
function addBot(html,state){const m=document.createElement('div');m.className='msg bot';m.appendChild(akti(state));const c=document.createElement('div');c.className='abody';c.innerHTML=html;m.appendChild(c);chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return c;}
function buttons(container,list,cb,primary){const w=document.createElement('div');w.className='opts';list.forEach((o,i)=>{const b=document.createElement('button');if(i===primary)b.className='primary';b.textContent=o;b.onclick=()=>{w.remove();cb(o);};w.appendChild(b);});container.appendChild(w);}

async function api(path,opts={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opts});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
const badge=r=>r.category?`<span class="badge">Категория: <b>${esc(r.category)}</b>${r.confidence!=null?` · уверенность ${Math.round(r.confidence*100)}%`:''}</span>`:'';
const stateFor=r=>r.type==='solution'?'solution':(r.type==='escalation'?'escalation':((r.type==='question'||r.type==='clarification')?'question':'idle'));

async function send(text){
  addUser(text);
  heroAkti.dataset.typing='false';
  const userMsg=chat.querySelector('.msg.user:last-of-type');
  if(userMsg)burstSalut(userMsg,8);
  document.getElementById('hero').classList.add('hide');
  pending=addBot('Разбираюсь в проблеме…','thinking');
  setHeader('thinking');
  let r;
  try{r=await api('/chat',{method:'POST',body:JSON.stringify({ticket_id:ticketId,message:text})});}
  catch(e){pending.innerHTML='Не удалось получить ответ прямо сейчас. Попробуйте ещё раз или передайте обращение специалисту.';setAkti(pending.parentElement,'escalation');setHeader('idle');pending=null;return;}
  if(r.ticket_id)ticketId=r.ticket_id;
  render(r);
  setTimeout(()=>{if(pending)burstSalut(pending.parentElement,14);},50);
}

function render(r){
  const c=pending||addBot('',stateFor(r));pending=null;
  setAkti(c.parentElement,stateFor(r));
  setHeader(stateFor(r));
  c.innerHTML=badge(r)+esc(r.message||'');
  if((r.type==='question'||r.type==='clarification')&&r.options&&r.options.length){buttons(c,r.options,o=>send(o));return;}
  if(r.type==='solution'&&r.steps&&r.steps.length){
    const ol=document.createElement('ol');ol.className='steps';
    r.steps.forEach(s=>{const li=document.createElement('li');li.textContent=s;ol.appendChild(li);});
    c.appendChild(ol);
    buttons(c,['Выполнил(а) шаги'],()=>{
      const q=addBot(esc(r.success_question||'Проблема решена?'),'solution');
      buttons(q,['Да, проблема решена','Нет, проблема осталась'],a=>a.startsWith('Да')?resolve():notHelped());
    },0);
    return;
  }
  if(r.type==='escalation'){escalateButtons(c);}
}

function escalateButtons(c){
  buttons(c,['Передать специалисту'],async()=>{
    try{
      await api(`/tickets/${ticketId}/escalate`,{method:'POST'});
      addBot(`Я передал обращение специалисту. Номер: #${ticketId}. Карточка с историей диагностики уже в кабинете поддержки.`,'escalation');
      setHeader('escalation');setTimeout(()=>setHeader('idle'),2000);
    }catch(e){addBot('Не удалось создать обращение. Попробуйте ещё раз.','escalation');}
  },0);
}

function notHelped(){
  const c=addBot('Похоже, стандартные способы не помогли.','escalation');
  escalateButtons(c);
}

async function resolve(){
  try{await api(`/tickets/${ticketId}/resolve`,{method:'POST'});}catch(e){}
  const c=addBot(`✓ Проблема решена. Обращение #${ticketId} закрыто.\nПомог ли вам Акти?`,'success');
  setTimeout(()=>burstSalut(c.parentElement,24),80);
  setTimeout(()=>{const a=c.parentElement.querySelector('.akti');if(a){a.dataset.mood='wink';setTimeout(()=>{a.dataset.mood='';},900);}},700);
  setTimeout(()=>setAkti(c.parentElement,'idle'),2200);
  stars(c);
}

/* ===== ВАША stars(): одноразовая оценка + already + support ===== */
function stars(c){
  const w=document.createElement('div');w.className='stars';
  let done=false;
  for(let i=1;i<=5;i++){const s=document.createElement('span');s.textContent='★';
    s.onclick=async()=>{
      if(done)return;
      done=true;
      [...w.children].forEach((el,idx)=>{el.className=idx<i?'on':'';el.onclick=null;});
      w.style.cursor='default';
      let r={};
      try{r=await api('/feedback',{method:'POST',body:JSON.stringify({ticket_id:ticketId,rating:i})});}catch(e){}
      if(r.support){
        addBot('Сожалею, что не смог помочь 😔 Ваша оценка и вся история диалога переданы в поддержку: специалист изучит обращение и свяжется с вами. Номер обращения #'+ticketId+'.','slow');
      }else if(r.status==='already'){
        addBot('Вы уже оценили это обращение — спасибо!');
      }else{
        addBot('Спасибо за оценку! Чем ещё помочь?','idle');
      }};
    w.appendChild(s);}
  c.appendChild(w);
}

document.getElementById('composer').onsubmit=e=>{e.preventDefault();const v=document.getElementById('input').value.trim();if(!v)return;document.getElementById('input').value='';send(v);};

async function openPanel(kind){
  const p=document.getElementById('panel');p.classList.add('open');
  const body=document.getElementById('panelBody');body.innerHTML='Загрузка…';
  try{
    if(kind==='history'){
      document.getElementById('panelTitle').textContent='История обращений';
      const list=await api('/tickets');
      body.innerHTML=Array.isArray(list)&&list.length?table(list,['id','category','status']):'<p>Пока обращений нет.</p>';
    }else if(kind==='support'){
      document.getElementById('panelTitle').textContent='Кабинет специалиста';
      const list=await api('/support/tickets');
      body.innerHTML=Array.isArray(list)&&list.length?table(list,['id','category','status','confidence']):'<p>Очередь пуста.</p>';
    }else{
      document.getElementById('panelTitle').textContent='Поиск по базе знаний';
      body.innerHTML='<input id="kbq" placeholder="Например: не приходит письмо"><div id="kbr"></div>';
      document.getElementById('kbq').oninput=async e=>{
        const q=e.target.value.trim();if(q.length<3)return;
        try{const res=await api('/knowledge/search?q='+encodeURIComponent(q));
          const list=Array.isArray(res)?res:(res.results||[]);
          document.getElementById('kbr').innerHTML=list.length?table(list,['title','category']):'<p>Ничего не найдено.</p>';
        }catch(err){document.getElementById('kbr').innerHTML='<p>Поиск временно недоступен.</p>';}
      };
    }
  }catch(e){body.innerHTML='Не удалось загрузить данные.';}
}
function table(rows,cols){return '<table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('')+'</table>';}
function closePanel(){document.getElementById('panel').classList.remove('open');}

(async()=>{
  const c=addBot('Опишите проблему своими словами — я помогу разобраться.','idle');
  buttons(c,['Не могу войти в Актион 360','Не приходит письмо','Не открывается страница','Нет звука на вебинаре'],o=>send(o));
})();
</script>
</body>
</html>
