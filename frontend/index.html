<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Актион Ассист — техническая поддержка</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%23E30611" d="M96 50 60.6 52.8 70.8 62 57.4 56.7 72.9 82.8 53.8 60.3 51.9 71.9 48.6 59.9 34.9 91.3 43.7 59 30.1 66.7 41.2 54.7 13.3 59.8 39 50 28.7 44.3 41.1 45.5 14.8 20.4 43.7 41 41.8 27.4 48.6 40.1 53.5 10.2 53.8 39.7 64.9 28.7 57.9 43.8Z"/></svg>'>
<style>
:root{--red:#E30611;--red-d:#B00500;--bg:#fff;--gray:#f5f5f7;--text:#1d1d1f;--muted:#86868b;--r:20px;--sh:0 8px 30px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(620px 300px at 50% -60px,rgba(227,6,17,.06),transparent 70%);pointer-events:none;z-index:0}
::selection{background:rgba(227,6,17,.14)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #f0f0f2;background:rgba(255,255,255,.82);backdrop-filter:saturate(1.4) blur(10px);position:sticky;top:0;z-index:5}
header b{font-size:17px;letter-spacing:-.01em}
header .tag{font-size:11px;color:var(--muted);border:1px solid #e6e6e9;border-radius:6px;padding:1px 6px}
header nav{margin-left:auto;display:flex;gap:8px}
header nav button{border:none;background:var(--gray);border-radius:12px;padding:9px 13px;font-size:13px;cursor:pointer;transition:.2s}
header nav button:hover{background:#ececef;transform:translateY(-1px)}
#chat{flex:1;overflow-y:auto;padding:20px 16px;max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
#chat::-webkit-scrollbar{width:8px}
#chat::-webkit-scrollbar-thumb{background:#e3e3e6;border-radius:8px}
.hero{text-align:center;padding:26px 0 6px;transition:opacity .45s,transform .45s;animation:pop .6s cubic-bezier(.2,.9,.3,1.15)}
.hero.hide{opacity:0;transform:translateY(-10px);height:0;padding:0;overflow:hidden;pointer-events:none}
.hero h1{font-size:clamp(28px,6vw,44px);letter-spacing:-.03em;font-weight:700;margin-top:10px}
.hero h1 b{color:var(--red)}
.hero p{color:var(--muted);font-size:15px;margin-top:6px}
.msg{max-width:88%;padding:13px 15px;border-radius:var(--r);font-size:15px;line-height:1.5;white-space:pre-wrap;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.msg.user{align-self:flex-end;background:var(--gray)}
.msg.bot{align-self:flex-start;background:#fff;border:1px solid #ededf0;box-shadow:var(--sh);display:flex;gap:11px}
.abody{min-width:0}
.badge{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.badge b{color:var(--red)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.opts button{border:1px solid #e6e6e9;background:#fff;border-radius:14px;padding:11px 15px;font-size:14px;cursor:pointer;min-height:44px;transition:.18s}
.opts button:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px);box-shadow:0 6px 16px rgba(227,6,17,.12)}
.opts button:active{transform:scale(.97)}
.opts button.primary{background:var(--red);border-color:var(--red);color:#fff}
.opts button.primary:hover{background:var(--red-d)}
.steps{list-style:none;margin:9px 0 4px;counter-reset:s}
.steps li{counter-increment:s;padding:11px 13px;border:1px solid #ededf0;border-radius:14px;margin-bottom:7px;font-size:14px;transition:.18s;background:#fff}
.steps li:hover{border-color:rgba(227,6,17,.35)}
.steps li::before{content:counter(s);display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--gray);color:var(--red);font-weight:700;text-align:center;line-height:22px;margin-right:9px;font-size:12px}
.stars{font-size:27px;cursor:pointer;letter-spacing:5px;color:#d6d6da;margin-top:7px}
.stars span{transition:.15s}
.stars span:hover{transform:scale(1.2)}
.stars span.on{color:var(--red)}
#composer{display:flex;gap:9px;padding:13px 16px;border-top:1px solid #f0f0f2;max-width:780px;width:100%;margin:0 auto;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);position:relative;z-index:2}
#composer input{flex:1;border:1px solid #e6e6e9;border-radius:16px;padding:13px 15px;font-size:15px;outline:none;transition:.2s}
#composer input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(227,6,17,.08)}
#composer button{width:48px;height:48px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:18px;cursor:pointer;transition:.18s;box-shadow:0 6px 18px rgba(227,6,17,.28)}
#composer button:hover{background:var(--red-d);transform:translateY(-1px)}
#composer button:active{transform:scale(.94)}

/* =========================================================
   АКТИ v5: РАЗНЫЕ ПЕРСОНАЖИ ДЛЯ ШАПКИ И HERO
   ========================================================= */
.akti{flex:none}
.akti svg{width:100%;height:100%;display:block;overflow:visible}
.akti .a-glow{fill:var(--red);opacity:.16;filter:blur(7px);transform-box:fill-box;transform-origin:center;animation:k-glow 2.6s ease-in-out infinite}
.akti .a-core{fill:var(--red);transform-box:fill-box;transform-origin:center;transition:opacity .3s, transform .4s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 0 5px rgba(227,6,17,.5)) drop-shadow(0 0 16px rgba(227,6,17,.22))}
.akti .a-halo{fill:none;stroke:var(--red);stroke-width:2.5;stroke-dasharray:3 11;stroke-linecap:round;opacity:0;transform-box:fill-box;transform-origin:center}
.akti .a-mini{fill:var(--red);opacity:0;transform-box:fill-box;transform-origin:center}
.akti .a-body,.akti .a-s{transform-box:fill-box;transform-origin:center}
.akti .a-s{fill:var(--red);opacity:0}
.akti .s1{animation:k-star 3.2s ease-out infinite .5s}
.akti .s2{animation:k-star 4.3s ease-out infinite 1.7s}
.akti .s3{animation:k-star 3.7s ease-out infinite 2.5s}
.akti .s4{animation:k-star 5.1s ease-out infinite .9s}
.akti .a-q{fill:var(--red);font-family:-apple-system,"Segoe UI",sans-serif;font-weight:900;font-size:56px;text-anchor:middle;dominant-baseline:central;opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 0 8px rgba(227,6,17,.55))}

/* --- ЛОГОТИП В ШАПКЕ: только светится, спокойно --- */
.akti.logo{width:34px;height:34px}
.akti.logo svg{animation:k-spin 22s linear infinite}
.akti.logo .a-body{animation:k-breathe 4s ease-in-out infinite}
.akti.logo .a-s{animation:none;opacity:0}
.akti.logo .a-mini{display:none}
.akti.logo .a-halo{display:none}
.akti.logo .a-q{display:none}

/* --- HERO-АКТИ: крупная, интерактивная, 3D-perspective --- */
.hero-akti-wrap{perspective:600px;width:140px;height:140px;margin:0 auto;position:relative}
.hero-akti{width:100%;height:100%;transition:transform .25s cubic-bezier(.2,.9,.3,1.1);transform-style:preserve-3d;will-change:transform}
.hero-akti .a-s.s1{transform:translateZ(40px)}
.hero-akti .a-s.s2{transform:translateZ(60px)}
.hero-akti .a-s.s3{transform:translateZ(30px)}
.hero-akti .a-s.s4{transform:translateZ(50px)}
.hero-akti .a-body{transform:translateZ(20px);animation:k-life 6s ease-in-out infinite}

/* --- ПУЗЫРЬ-АКТИ (в сообщениях): компактная, с состояниями --- */
.msg .akti{width:38px;height:38px}

/* состояния (применяются к пузырям и hero) */
.akti[data-state="idle"] .a-core{}
.akti[data-state="thinking"] svg{animation:k-spin 1s linear infinite}
.akti[data-state="thinking"] .a-body{animation:k-jit .45s steps(2,end) infinite}
.akti[data-state="thinking"] .a-glow{animation:k-glow 1s ease-in-out infinite}
.akti[data-state="thinking"] .a-halo{opacity:.85;animation:k-spin 2s linear infinite reverse}
.akti[data-state="question"] svg{animation:k-wob 1.3s cubic-bezier(.3,1.6,.4,1) infinite}
.akti[data-state="question"] .s2{animation:k-star 1.1s ease-out infinite}
.akti[data-state="question"] .a-mini{opacity:1;animation:k-twinkle 1.2s ease-in-out infinite}
.akti[data-state="solution"] .a-core{animation:k-snap .85s cubic-bezier(.2,1.8,.4,1) infinite}
.akti[data-state="solution"] .a-glow{opacity:.3;animation:k-glow .9s ease-in-out infinite}
.akti[data-state="solution"] .a-s{animation:k-star 1s ease-out infinite}
.akti[data-state="success"] .a-core{animation:k-popout .75s ease-out forwards}
.akti[data-state="success"] .a-halo{opacity:1;animation:k-halo .9s ease-out forwards}
.akti[data-state="success"] .a-glow{animation:k-flare .9s ease-out forwards}
.akti[data-state="success"] .s1{animation:k-fly1 .9s ease-out forwards}
.akti[data-state="success"] .s2{animation:k-fly2 .9s ease-out forwards}
.akti[data-state="success"] .s3{animation:k-fly3 .9s ease-out forwards}
.akti[data-state="success"] .s4{animation:k-fly4 .9s ease-out forwards}
.akti[data-state="escalation"] svg{animation:k-spin 26s linear infinite reverse}
.akti[data-state="escalation"] .a-body{animation:k-droop 3s ease-in-out infinite}
.akti[data-state="escalation"] .a-core{opacity:.35}
.akti[data-state="escalation"] .a-glow{opacity:.07;animation:k-glow 4.5s ease-in-out infinite}
.akti[data-state="escalation"] .a-s{animation:none;opacity:0}
.akti[data-state="escalation"] .s3{animation:k-star 4.5s ease-out infinite 1.2s}
.akti[data-state="slow"]{composes:escalation}
.akti[data-state="slow"] svg{animation:k-spin 32s linear infinite reverse}
.akti[data-state="slow"] .a-core{opacity:.28}

/* typing в hero: искра сжимается, появляется "?" */
.hero-akti[data-typing="true"] .a-core{transform:scale(.45);opacity:.35}
.hero-akti[data-typing="true"] .a-glow{opacity:.08}
.hero-akti[data-typing="true"] .a-s{animation:none;opacity:0}
.hero-akti[data-typing="true"] .a-mini{opacity:0}
.hero-akti[data-typing="true"] .a-q{opacity:1;transform:scale(1) rotate(-6deg);animation:k-q-pulse 1.1s ease-in-out infinite}
@keyframes k-q-pulse{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.12) rotate(4deg)}}

/* ключевые кадры */
@keyframes k-spin{to{transform:rotate(360deg)}}
@keyframes k-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes k-glow{0%,100%{opacity:.14;transform:scale(1)}50%{opacity:.3;transform:scale(1.14)}}
@keyframes k-life{
0%,36%,62%,78%,100%{transform:translateZ(20px) translateY(0) scale(1) rotate(0deg)}
18%{transform:translateZ(20px) translateY(-3px) scale(1.02) rotate(2deg)}
55%{transform:translateZ(20px) translateY(-2px) scale(1.01) rotate(-2deg)}
64%{transform:translateZ(20px) translateY(1px) scale(1.18,.86) rotate(-4deg)}
68%{transform:translateZ(20px) translateY(-8px) scale(.94,1.12) rotate(5deg)}
74%{transform:translateZ(20px) translateY(0) scale(1.06,.94) rotate(-2deg)}
}
@keyframes k-jit{0%{transform:translate(0,0)}25%{transform:translate(.7px,-.6px)}50%{transform:translate(-.6px,.5px)}75%{transform:translate(.5px,.6px)}100%{transform:translate(0,0)}}
@keyframes k-wob{0%,100%{transform:rotate(0deg)}30%{transform:rotate(9deg)}60%{transform:rotate(-7deg)}}
@keyframes k-twinkle{0%,100%{transform:scale(.55);opacity:.5}50%{transform:scale(1.1);opacity:1}}
@keyframes k-star{0%,100%{opacity:0;transform:scale(.2) rotate(0deg)}12%{opacity:1;transform:scale(1.2) rotate(25deg)}26%{opacity:0;transform:scale(.3) rotate(50deg)}}
@keyframes k-snap{0%{transform:scale(1) rotate(0deg)}10%{transform:scale(1.3) rotate(8deg)}22%{transform:scale(.94) rotate(-4deg)}36%{transform:scale(1.14) rotate(2deg)}55%,100%{transform:scale(1) rotate(0deg)}}
@keyframes k-popout{0%{transform:scale(1);opacity:1}100%{transform:scale(1.45);opacity:0}}
@keyframes k-halo{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes k-flare{0%{opacity:.5;transform:scale(1)}30%{opacity:.65;transform:scale(1.5)}100%{opacity:0;transform:scale(1.9)}}
@keyframes k-fly1{0%{opacity:0;transform:translate(0,0) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(-16px,-16px) scale(1.1) rotate(90deg)}}
@keyframes k-fly2{0%{opacity:0;transform:translate(0,0) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(16px,-14px) scale(1) rotate(-80deg)}}
@keyframes k-fly3{0%{opacity:0;transform:translate(0,0) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(-14px,15px) scale(.9) rotate(70deg)}}
@keyframes k-fly4{0%{opacity:0;transform:translate(0,0) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(15px,14px) scale(.8) rotate(-90deg)}}
@keyframes k-droop{0%,100%{transform:translateY(1px) scale(.97)}50%{transform:translateY(3px) scale(.95)}}

/* =========================================================
   САЛЮТ-КОНФЕТТИ из искр
   ========================================================= */
.salut-p{position:fixed;width:var(--size,6px);height:var(--size,6px);background:var(--c,var(--red));pointer-events:none;z-index:100;animation:salut-fly 1.1s cubic-bezier(.2,.7,.4,1) forwards;box-shadow:0 0 10px currentColor;border-radius:50% 10% 50% 10%;transform:translate(-50%,-50%);color:var(--c,var(--red))}
@keyframes salut-fly{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.2) rotate(0)}
  60%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 60px)) scale(1.2) rotate(var(--rot))}
}

/* панели */
.panel{position:fixed;inset:0;background:rgba(20,20,22,.35);backdrop-filter:blur(2px);display:none;z-index:10}
.panel.open{display:block}
.panel .box{position:absolute;right:0;top:0;bottom:0;width:min(450px,100%);background:#fff;padding:18px;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.12);border-radius:24px 0 0 24px;animation:slide .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.panel input{width:100%;border:1px solid #e6e6e9;border-radius:14px;padding:11px 13px;margin:10px 0;font-size:14px;outline:none}
.panel input:focus{border-color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:9px 6px;border-bottom:1px solid #f0f0f2;text-align:left}
th{color:var(--muted);font-weight:600}

@media (prefers-reduced-motion:reduce){.akti svg,.akti .a-body,.akti .a-core,.akti .a-mini,.akti .a-halo,.akti .a-glow,.akti .a-s,.akti .a-q,.msg,.hero,.salut-p{animation:none !important;transition:none !important}}
@media (max-width:640px){.hero-akti-wrap{width:110px;height:110px}}
</style>
</head>
<body>
<header>
  <div class="akti logo" id="logo" data-state="idle"></div>
  <b>Актион Ассист</b><span class="tag">AI</span>
  <nav>
    <button onclick="openPanel('history')">История</button>
    <button onclick="openPanel('kb')">База знаний</button>
    <button onclick="openPanel('support')">Специалисту</button>
  </nav>
</header>
<div id="chat">
  <div class="hero" id="hero">
    <div class="hero-akti-wrap">
      <div class="akti hero-akti" id="heroAkti" data-state="idle"></div>
    </div>
    <h1>Привет! Я <b>Акти</b></h1>
    <p>Решаю технические проблемы с продуктами Актиона — быстро и по-человечески.</p>
  </div>
</div>
<form id="composer">
  <input id="input" placeholder="Например: не могу войти в Актион 360" autocomplete="off">
  <button type="submit" aria-label="Отправить">↑</button>
</form>
<div class="panel" id="panel"><div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <b id="panelTitle"></b>
    <button onclick="closePanel()" style="border:none;background:none;font-size:20px;cursor:pointer">×</button>
  </div>
  <div id="panelBody"></div>
</div></div>

<script>
const API='/api';
let ticketId=null,pending=null;
const chat=document.getElementById('chat');
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* ===== SVG Акти v5: ядро + мини-искра + звёзды + знак вопроса ===== */
const SPARK="M96 50 60.6 52.8 70.8 62 57.4 56.7 72.9 82.8 53.8 60.3 51.9 71.9 48.6 59.9 34.9 91.3 43.7 59 30.1 66.7 41.2 54.7 13.3 59.8 39 50 28.7 44.3 41.1 45.5 14.8 20.4 43.7 41 41.8 27.4 48.6 40.1 53.5 10.2 53.8 39.7 64.9 28.7 57.9 43.8Z";
const STAR="M10 0 Q11.6 6.8 20 10 Q11.6 13.2 10 20 Q8.4 13.2 0 10 Q8.4 6.8 10 0Z";
function aktiSVG(){return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<circle class="a-glow" cx="50" cy="50" r="30"/>
<circle class="a-halo" cx="50" cy="50" r="45"/>
<g class="a-body">
  <path class="a-core" d="${SPARK}"/>
  <g transform="translate(74 6) scale(.3)"><path class="a-mini" d="${SPARK}"/></g>
</g>
<g transform="translate(6 12) scale(.8)"><path class="a-s s1" d="${STAR}"/></g>
<g transform="translate(78 18) scale(.6)"><path class="a-s s2" d="${STAR}"/></g>
<g transform="translate(10 74) scale(.7)"><path class="a-s s3" d="${STAR}"/></g>
<g transform="translate(76 70) scale(.5)"><path class="a-s s4" d="${STAR}"/></g>
<text class="a-q" x="50" y="52">?</text>
</svg>`;}
function akti(state){const d=document.createElement('div');d.className='akti';d.dataset.state=state||'idle';d.innerHTML=aktiSVG();return d;}
function setAkti(bubble,state){const a=bubble&&bubble.querySelector('.akti');if(a)a.dataset.state=state;}
document.querySelectorAll('.akti').forEach(el=>{el.innerHTML=aktiSVG();});
const logo=document.getElementById('logo');
const heroAkti=document.getElementById('heroAkti');
const heroWrap=document.querySelector('.hero-akti-wrap');
const setHeader=s=>{logo.dataset.state=s;};

/* ===== PARALLAX: hero-искра следит за мышью ===== */
let rafId=null;
heroWrap.addEventListener('mousemove',e=>{
  const rect=heroWrap.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width-.5;
  const y=(e.clientY-rect.top)/rect.height-.5;
  if(rafId)cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(()=>{
    heroAkti.style.transform=`rotateY(${x*28}deg) rotateX(${-y*24}deg) translate(${x*10}px,${y*10}px)`;
  });
});
heroWrap.addEventListener('mouseleave',()=>{
  heroAkti.style.transform='';
});
/* для тач-устройств: лёгкий параллакс от гироскопа (если доступен) */
window.addEventListener('deviceorientation',e=>{
  if(e.gamma==null)return;
  const x=Math.max(-1,Math.min(1,(e.gamma||0)/30));
  const y=Math.max(-1,Math.min(1,((e.beta||0)-45)/30));
  heroAkti.style.transform=`rotateY(${x*20}deg) rotateX(${-y*16}deg)`;
},{passive:true});

/* ===== TYPING: при вводе — форма вопроса ===== */
const inputEl=document.getElementById('input');
inputEl.addEventListener('input',()=>{
  heroAkti.dataset.typing=inputEl.value.trim()?'true':'false';
});

/* ===== САЛЮТ-КОНФЕТТИ ===== */
function burstSalut(origin,count=18){
  const rect=origin.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;
  const colors=['#E30611','#FF2A38','#B00500','#FF5A63','#8A0008'];
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='salut-p';
    const angle=(Math.PI*2*i)/count+(Math.random()-.5)*.5;
    const dist=70+Math.random()*110;
    const dx=Math.cos(angle)*dist;
    const dy=Math.sin(angle)*dist-20;
    p.style.left=cx+'px';
    p.style.top=cy+'px';
    p.style.setProperty('--dx',dx+'px');
    p.style.setProperty('--dy',dy+'px');
    p.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    p.style.setProperty('--size',(4+Math.random()*7)+'px');
    p.style.setProperty('--c',colors[i%colors.length]);
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1300);
  }
}

function addUser(t){const m=document.createElement('div');m.className='msg user';m.textContent=t;chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return m;}
function addBot(html,state){const m=document.createElement('div');m.className='msg bot';m.appendChild(akti(state));const c=document.createElement('div');c.className='abody';c.innerHTML=html;m.appendChild(c);chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return c;}
function buttons(container,list,cb,primary){const w=document.createElement('div');w.className='opts';list.forEach((o,i)=>{const b=document.createElement('button');if(i===primary)b.className='primary';b.textContent=o;b.onclick=()=>{w.remove();cb(o);};w.appendChild(b);});container.appendChild(w);}

async function api(path,opts={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opts});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
const badge=r=>r.category?`<span class="badge">Категория: <b>${esc(r.category)}</b>${r.confidence!=null?` · уверенность ${Math.round(r.confidence*100)}%`:''}</span>`:'';
const stateFor=r=>r.type==='solution'?'solution':(r.type==='escalation'?'escalation':((r.type==='question'||r.type==='clarification')?'question':'idle'));

async function send(text){
  addUser(text);
  /* сбрасываем форму вопроса */
  heroAkti.dataset.typing='false';
  /* мини-салют от user-пузыря как "выстрел" */
  const userMsg=chat.querySelector('.msg.user:last-of-type');
  if(userMsg)burstSalut(userMsg,8);
  document.getElementById('hero').classList.add('hide');
  pending=addBot('Разбираюсь в проблеме…','thinking');
  setHeader('thinking');
  let r;
  try{r=await api('/chat',{method:'POST',body:JSON.stringify({ticket_id:ticketId,message:text})});}
  catch(e){pending.innerHTML='Не удалось получить ответ прямо сейчас. Попробуйте ещё раз или передайте обращение специалисту.';setAkti(pending.parentElement,'escalation');setHeader('idle');pending=null;return;}
  if(r.ticket_id)ticketId=r.ticket_id;
  render(r);
  /* САЛЮТ от пузыря с ответом */
  setTimeout(()=>{if(pending)burstSalut(pending.parentElement,14);},50);
}

function render(r){
  const c=pending||addBot('',stateFor(r));pending=null;
  setAkti(c.parentElement,stateFor(r));
  setHeader(stateFor(r));
  c.innerHTML=badge(r)+esc(r.message||'');
  if((r.type==='question'||r.type==='clarification')&&r.options&&r.options.length){buttons(c,r.options,o=>send(o));return;}
  if(r.type==='solution'&&r.steps&&r.steps.length){
    const ol=document.createElement('ol');ol.className='steps';
    r.steps.forEach(s=>{const li=document.createElement('li');li.textContent=s;ol.appendChild(li);});
    c.appendChild(ol);
    buttons(c,['Выполнил(а) шаги'],()=>{
      const q=addBot(esc(r.success_question||'Проблема решена?'),'solution');
      buttons(q,['Да, проблема решена','Нет, проблема осталась'],a=>a.startsWith('Да')?resolve():notHelped());
    },0);
    return;
  }
  if(r.type==='escalation'){escalateButtons(c);}
}

function escalateButtons(c){
  buttons(c,['Передать специалисту'],async()=>{
    try{
      await api(`/tickets/${ticketId}/escalate`,{method:'POST'});
      addBot(`Я передал обращение специалисту. Номер: #${ticketId}. Карточка с историей диагностики уже в кабинете поддержки.`,'escalation');
      setHeader('escalation');setTimeout(()=>setHeader('idle'),2000);
    }catch(e){addBot('Не удалось создать обращение. Попробуйте ещё раз.','escalation');}
  },0);
}

function notHelped(){
  const c=addBot('Похоже, стандартные способы не помогли.','escalation');
  escalateButtons(c);
}

async function resolve(){
  try{await api(`/tickets/${ticketId}/resolve`,{method:'POST'});}catch(e){}
  const c=addBot(`✓ Проблема решена. Обращение #${ticketId} закрыто.\nПомог ли вам Акти?`,'success');
  /* большой салют в честь победы */
  setTimeout(()=>burstSalut(c.parentElement,24),80);
  setTimeout(()=>setAkti(c.parentElement,'idle'),1700);
  stars(c);
}

/* ===== ОБНОВЛЁННЫЙ stars() с r.support ===== */
function stars(c){
  const w=document.createElement('div');w.className='stars';
  for(let i=1;i<=5;i++){const s=document.createElement('span');s.textContent='★';
    s.onclick=async()=>{[...w.children].forEach((el,idx)=>el.className=idx<i?'on':'');
      let r={};
      try{r=await api('/feedback',{method:'POST',body:JSON.stringify({ticket_id:ticketId,rating:i})});}catch(e){}
      if(r.support){
        addBot('Сожалею, что не смог помочь 😔 Ваша оценка и вся история диалога переданы в поддержку: специалист изучит обращение и свяжется с вами. Номер обращения #'+ticketId+'.','slow');
      }else{
        addBot('Спасибо за оценку! Чем ещё помочь?','idle');
      }};
    w.appendChild(s);}
  c.appendChild(w);
}

document.getElementById('composer').onsubmit=e=>{e.preventDefault();const v=document.getElementById('input').value.trim();if(!v)return;document.getElementById('input').value='';send(v);};

async function openPanel(kind){
  const p=document.getElementById('panel');p.classList.add('open');
  const body=document.getElementById('panelBody');body.innerHTML='Загрузка…';
  try{
    if(kind==='history'){
      document.getElementById('panelTitle').textContent='История обращений';
      const list=await api('/tickets');
      body.innerHTML=Array.isArray(list)&&list.length?table(list,['id','category','status']):'<p>Пока обращений нет.</p>';
    }else if(kind==='support'){
      document.getElementById('panelTitle').textContent='Кабинет специалиста';
      const list=await api('/support/tickets');
      body.innerHTML=Array.isArray(list)&&list.length?table(list,['id','category','status','confidence']):'<p>Очередь пуста.</p>';
    }else{
      document.getElementById('panelTitle').textContent='Поиск по базе знаний';
      body.innerHTML='<input id="kbq" placeholder="Например: не приходит письмо"><div id="kbr"></div>';
      document.getElementById('kbq').oninput=async e=>{
        const q=e.target.value.trim();if(q.length<3)return;
        try{const res=await api('/knowledge/search?q='+encodeURIComponent(q));
          const list=Array.isArray(res)?res:(res.results||[]);
          document.getElementById('kbr').innerHTML=list.length?table(list,['title','category']):'<p>Ничего не найдено.</p>';
        }catch(err){document.getElementById('kbr').innerHTML='<p>Поиск временно недоступен.</p>';}
      };
    }
  }catch(e){body.innerHTML='Не удалось загрузить данные.';}
}
function table(rows,cols){return '<table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('')+'</table>';}
function closePanel(){document.getElementById('panel').classList.remove('open');}

/* приветствие */
(async()=>{
  const c=addBot('Опишите проблему своими словами — я помогу разобраться.','idle');
  buttons(c,['Не могу войти в Актион 360','Не приходит письмо','Не открывается страница','Нет звука на вебинаре'],o=>send(o));
})();
</script>
